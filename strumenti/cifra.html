<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Olfattiva · cifra i contenuti</title>
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<main class="page" style="max-width:720px">
<div class="stack-lg">
<header class="stack"><div class="eyebrow">Strumento per chi gestisce il sito</div><h1 class="h1" style="font-size:48px">Cifra i contenuti</h1>
<p class="lede">Scegli il file dati.json (quello in chiaro, che tieni solo sul tuo computer) e una password. Ottieni olfattiva.enc da caricare in data/ sull’hosting. Tutto avviene in questo browser: niente viene inviato.</p></header>
<form id="f" class="card">
<div class="field"><label for="file">File dati.json</label><input class="input" id="file" type="file" accept="application/json" required style="padding:12px 16px"></div>
<div class="field"><label for="pw">Password (almeno 12 caratteri)</label><input class="input" id="pw" type="password" minlength="12" required autocomplete="new-password"></div>
<button class="btn dark" type="submit">Cifra e scarica olfattiva.enc</button>
<p class="help" id="out" role="status"></p>
</form>
</div>
</main>
<script src="cifra.js"></script>
</body>
</html>
